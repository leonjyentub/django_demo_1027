{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card mt-4">
            <div class="card-header text-center py-3">
                <h4 class="mb-0" style="color: var(--uni-primary);">
                    <i class="bi bi-shield-lock me-2"></i>系統登入
                </h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">使用者帳號</label>
                        <input type="text" name="username" class="form-control" id="id_username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-semibold">密碼</label>
                        <input type="password" name="password" class="form-control" id="id_password" required>
                    </div>
                    {% if form.errors %}
                    <div class="alert alert-danger">
                        帳號或密碼錯誤，請重新輸入
                    </div>
                    {% endif %}
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i>登入
                    </button>
                </form>
            </div>
            <div class="card-footer text-center text-muted small bg-white">
                大學選課系統
            </div>
        </div>
    </div>
</div>
{% endblock %}
